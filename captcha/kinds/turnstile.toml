name = "turnstile"
kind = "checkbox"

[signals]
iframe_src = ["challenges.cloudflare.com/turnstile"]
custom_elements = ["cf-turnstile"]
scripts = ["challenges.cloudflare.com/turnstile/v0/api.js"]

target = "first checkbox in this BC"
token = { hidden_input = "cf-turnstile-response" }

[integrity]
# Cloudflare's documented test keys. A run that clears one of these has proven
# nothing, so a scorecard row built on them is refused.
always_block_sitekeys = [
    "2x00000000000000000000AB",
    "3x00000000000000000000FF",
]
