<!doctype html>
<meta charset="utf-8">
<title>audio host page</title>
<!--
  The page half of the `audio` fixture. The widget is served from a different host,
  so the browser gives it its own browsing context in its own process: the parent
  cannot press its play control, cannot read its answer field, and cannot fetch its
  recording. The clip is scoped to the widget's own origin, which is the shape every
  audio deployment has and the reason the bytes are read in the widget's context
  rather than by a second client.

  CHILD_URL is substituted by lurien/tests/audio_fixture.py.
-->
<style>
  body { font: 14px system-ui; margin: 0; padding: 24px; }
  iframe { width: 400px; height: 320px; border: 1px solid #ccc; }
</style>

<h1>Verification required</h1>
<p>Type what the recording says to continue.</p>
<iframe src="CHILD_URL" title="audio widget"></iframe>
<div id="parent-state">the parent cannot read the widget</div>

<script>
  // The parent reaching into the widget must throw, or the fixture is not
  // cross-origin and proves nothing about the context the engine had to reach.
  const frame = document.querySelector("iframe");
  frame.addEventListener("load", () => {
    try {
      const reached = frame.contentDocument?.getElementById("captcha-audio");
      document.getElementById("parent-state").textContent = reached
        ? "same origin: this fixture is misconfigured"
        : "the parent cannot read the widget";
    } catch (e) {
      document.getElementById("parent-state").textContent = "the parent cannot read the widget";
    }
  });
</script>
