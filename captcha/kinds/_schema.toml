# Closed kinds. A vendor TOML that names anything else is red.
# The registry test enumerates this file at run time.

kinds = [
    "none",
    "score",
    "checkbox",
    "visual",
    "slider",
    "audio",
    "pow",
    "fail",
]

# Required fields on every vendor file.
vendor_fields = [
    "name",
    "kind",
    "signals.iframe_src",
    "target",
    "token",
]

# A `slider` binding also carries `handle`: the element a hand grabs, when that is
# not the element being measured. The crop comes from `target` and the drag starts
# on `handle`, because dragging the puzzle itself moves nothing on a live widget.

# The `token` inline table names where success can be observed. At least one of
# these keys is required, because a solve nobody can observe would have to be
# assumed:
#
#   hidden_input   form field name the vendor fills
#   verify_field   same, for a vendor that calls it a verify field
#   cookie         cookie name whose presence is the token
#   storage        localStorage or sessionStorage key, in the widget's own origin
#   message        dotted path in a payload the widget posts to its page, such as
#                  `token` or `detail.token`. The only channel for a vendor that
#                  writes nothing down, so it is observed by listening from the
#                  moment the page is seen, not by polling afterwards.
#
# The list is enumerated by the registry test at run time, so a `token` key that
# is not here, or a key here that `lurien/build.rs` does not read, is red.
token_channels = [
    "hidden_input",
    "verify_field",
    "cookie",
    "storage",
    "message",
]

# Target language the engine can execute. `target` and `handle` on a binding whose
# kind this build claims must be one of these forms, or a CSS selector, which the
# registry test recognizes as a value with no spaces in it. Prose is allowed only
# on a kind nothing acts on yet, where it records what the element would be.
target_forms = [
    "first checkbox",
    "first canvas",
    "first draggable",
    "role:",
]

# A `visual` binding also carries a [grid] table. A tile challenge asks a question
# in words about pictures, so the binding says where the words are and what a tile
# is; the browser reads both in the widget's own context and answers with indices
# into the list it laid out.
#
#   prompt   selector of the element holding the question text
#   cell     selector matching every tile, in document order
#   submit   optional selector of the button that confirms the set. A widget that
#            scores each tile as it is clicked has none.
#
# A `visual` binding with no [grid] table is still recognized, and its solve is
# refused by name: the widget is known, the selectors that would answer it are
# not. That is a smaller lie than a table of guessed class names.

# A `pow` binding also carries a [work] table. Proof of work is arithmetic, not
# perception: the binding says where to read the challenge, how hard it is, and
# where the answer goes, and the browser does the rest with no helper process.
#
#   algo        one of pow_algos
#   format      one of pow_formats: how difficulty is counted
#   challenge   address of the challenge string
#   difficulty  address of the difficulty, or a literal integer
#   salt        optional address of a salt joined before the nonce
#   submit      address the answer is written to
#
# Addresses: `global:a.b.c` reads a page global, `attr:<css>@<name>` reads an
# attribute, `text:<css>` reads text content, `lit:<value>` is a literal.
# Submit addresses: `field:<css>` types into a field, `call:a.b.c` calls a page
# function with {nonce, hash}, `url:<template>` navigates with {nonce} and {hash}
# substituted.

pow_algos = ["sha256"]
pow_formats = ["hex-zeros", "bits"]

# Address forms the engine implements. The registry test reads these at run time,
# so a vendor that invents a form no primitive can execute is red before a page
# ever sees it.
work_read_forms = ["global:", "attr:", "text:", "lit:"]
work_submit_forms = ["field:", "call:", "url:"]
