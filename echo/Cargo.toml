[package]
name = "guise-echo"
version = "0.1.8"
description = "Local TLS+H2+TCP echo service for inspecting emitted wire fingerprints"
keywords = ["tls", "echo", "fingerprint", "testing"]
homepage = "https://santh.dev"
repository = "https://github.com/santhreal/guise-echo"
documentation = "https://docs.rs/guise-echo"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]

[package.metadata.santh]
status = "beta"

[dependencies]
anyhow = { workspace = true }
guise = { path = "../guise", version = "0.1.8", features = ["fingerprint", "http"] }
rustls = { workspace = true, features = ["ring"] }
rustls-pki-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tls-parser = "0.12"
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
proptest = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
