# Tier-B fingerprint-target catalogue (community-extensible).
#
# Drop a TOML file like this one to EXTEND the built-in real-browser catalogue
# that `fingerprint::cluster` classifies against. More real-browser targets =
# a denser anti-uniqueness cluster (a spoofed shape that collides with a
# populated cluster is harder to track than a unique one). The built-in list is
# always the default; these are added on top via
# `tls_targets::load_targets_from_toml` + `tls_targets::builtin_with`.
#
# Rules (the loader fails CLOSED, it never silently skips a bad entry):
#   - every field is required and non-empty
#   - `label`     must be unique (not another loaded label, not a built-in)
#   - `ja3`       must start with the TLS-version token `771,`
#   - `ja4`       must start with `t13` (a TLS 1.3 target)
#   - `akamai_h2` must be the 4-part pipe form
#                 `settings|window_update|priority|header-order`
#   - `peet_h2`   must equal md5(`akamai_h2`), peet.ws derives its H2 hash that
#                 way, so anything else is fabricated and is rejected at load
#   - file size is capped at 64 KiB
#
# Provide ONLY measured values, a fabricated fingerprint defeats the purpose
# (it would put you in an empty cluster). The entry below is the real, measured
# Firefox-150 / Linux shape (the same one shipped built-in as
# `firefox-150-linux`), under a distinct label so it loads as a worked example.

[[target]]
label = "firefox-150-linux-example"
ja3 = "771,4865-4867-4866-49195-49199-52393-52392-49196-49200-49162-49161-49171-49172-156-157-47-53,0-23-65281-10-11-16-5-34-18-51-43-13-45-28-27-65037-41,4588-29-23-24-25-256-257,0"
ja4 = "t13d1717h2_5b57614c22b0_e6dcd7ae0a9e"
akamai_h2 = "1:65536;2:0;4:131072;5:16384|12517377|0|m,p,a,s"
peet_h2 = "6ea73faa8fc5aac76bded7bd238f6433"
