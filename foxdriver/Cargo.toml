[package]
name = "runtime-foxdriver"
version = "0.1.5"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
description = "Firefox browser automation via WebDriver BiDi (rustenium)"
repository = "https://github.com/santhreal/runtime-foxdriver"
homepage = "https://santh.dev"
documentation = "https://docs.rs/runtime-foxdriver"
readme = "README.md"
keywords = ["firefox", "browser", "bidi", "webdriver", "automation"]
categories = ["web-programming", "network-programming"]

[package.metadata.santh]
status = "beta"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rustenium = "1.1"
rustenium-core = "1.1"
rustenium-bidi-definitions = "0.1"
regex = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
tracing = "0.1"

# SIGTERM (graceful shutdown) so Firefox flushes localStorage/IndexedDB/cookies to
# the profile before exit, a SIGKILL (std `Child::kill`) loses unflushed storage,
# breaking profile persistence across restarts. `nix::sys::signal::kill` is a safe
# wrapper (this crate forbids `unsafe`).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
proptest = "1.9"

[lints.rust]
unsafe_code = "forbid"
