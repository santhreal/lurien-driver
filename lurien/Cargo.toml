[package]
name = "lurien-driver"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Santh <64453045+santhreal@users.noreply.github.com>"]
repository = "https://github.com/santhreal/lurien-driver"
homepage = "https://santh.dev"
description = "Playwright-shaped Firefox with a coherent persona. Engine required."
readme = "README.md"
keywords = ["firefox", "browser", "playwright", "stealth", "bidi"]
categories = ["web-programming", "command-line-utilities"]

[lib]
name = "lurien"
path = "src/lib.rs"

[[bin]]
name = "lurien"
path = "bins/lurien.rs"

[[bin]]
name = "lurien-mcp"
path = "bins/lurien-mcp.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
guise = { path = "../guise", version = "0.1.8", default-features = false, features = ["browser"] }
rand = { workspace = true }
runtime-foxdriver = { path = "../foxdriver", version = "0.1.5" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[package.metadata.santh]
status = "alpha"
